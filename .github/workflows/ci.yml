name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck -x -S warning lib/common.sh post-install.sh debian/post-install.sh cachyos/post-install.sh tests/sandbox.sh

  sandbox:
    name: sandbox (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:trixie",     distro: debian }
          - { image: "debian:bookworm",   distro: debian }
          - { image: "archlinux:latest",  distro: cachyos }
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sandbox.sh ${{ matrix.distro }}
